name: Publish identity migration runner

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: c511716f077752f69d0b0dff7e5f9174d51a3103
      IMAGE: ghcr.io/sherydans12/edupay-identity-migrate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c511716f077752f69d0b0dff7e5f9174d51a3103
          fetch-depth: 1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify migration target command
        run: |
          docker build --target migrate --tag local/identity-migrate-proof .
          test "$(docker image inspect local/identity-migrate-proof --format '{{json .Config.Cmd}}')" = '["pnpm","prisma:migrate:deploy"]'
          test -z "$(docker image inspect local/identity-migrate-proof --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Ei 'DATABASE_URL|TOKEN|SECRET|PASSWORD|PRIVATE_KEY' || true)"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: migrate
          push: true
          tags: ghcr.io/sherydans12/edupay-identity-migrate:c511716f077752f69d0b0dff7e5f9174d51a3103
          labels: |
            org.opencontainers.image.source=https://github.com/Sherydans12/edupay-identity
            org.opencontainers.image.revision=c511716f077752f69d0b0dff7e5f9174d51a3103
            org.opencontainers.image.title=EduPay Identity migration runner
