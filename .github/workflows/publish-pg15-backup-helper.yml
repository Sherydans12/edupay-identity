name: Publish public PostgreSQL 15 backup helper

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: Reviewed informational image tag (the manifest digest is authoritative)
        required: true
        default: pg15.19-20260816
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/sherydans12/edupay-pg15-backup-helper

jobs:
  publish:
    name: Build, publish, and verify helper
    runs-on: ubuntu-latest

    steps:
      - name: Check out the dispatched revision
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the helper
        id: build
        uses: docker/build-push-action@v6
        with:
          context: deploy/backup-helper
          file: deploy/backup-helper/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.version_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Pull and verify the public immutable manifest
        env:
          IMAGE_REFERENCE: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker logout ghcr.io || true
          docker buildx imagetools inspect "$IMAGE_REFERENCE"
          docker pull "$IMAGE_REFERENCE"
          docker run --rm --entrypoint bash "$IMAGE_REFERENCE" -ceu '
            pg_dump --version | grep -E "^pg_dump \(PostgreSQL\) 15\.19"
            pg_restore --version | grep -E "^pg_restore \(PostgreSQL\) 15\.19"
            aws --version
            command -v tar
            test -s /etc/ssl/certs/ca-certificates.crt
            test -x /bin/bash
          '
          if docker history --no-trunc "$IMAGE_REFERENCE" | grep -Eiq 'DATABASE_URL|AWS_ACCESS_KEY|AWS_SECRET|R2_|JWT|PRIVATE KEY|PASSWORD|CREDENTIAL|SECRET|COOLIFY|RESEND_API_KEY'; then
            echo "Sensitive marker found in helper image history." >&2
            exit 1
          fi
          echo "GHCR_HELPER_TAG=${IMAGE_NAME}:${{ inputs.version_tag }}"
          echo "GHCR_HELPER_MANIFEST_DIGEST=${{ steps.build.outputs.digest }}"
          echo "GHCR_HELPER_IMMUTABLE_REFERENCE=$IMAGE_REFERENCE"
          echo "GHCR_PUBLIC_BACKUP_HELPER_ACCEPTED=YES"
          echo "GHCR_HELPER_PULL_AUTH_REQUIRED=NO"
