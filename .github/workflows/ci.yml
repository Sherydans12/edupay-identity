name: CI

on:
  push:
    branches: ['main', 'chore/**', 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character commit SHA to validate and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:9b1d34adbce1dd07ee6e94b4a2cf698884b89bd44a6c9c12f5da8f3acbfe4957
        env:
          POSTGRES_DB: identity_ci
          POSTGRES_USER: identity_ci
          POSTGRES_PASSWORD: identity_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U identity_ci -d identity_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://identity_ci:identity_ci_only@localhost:5432/identity_ci
      TEST_DATABASE_URL: postgresql://identity_ci:identity_ci_only@localhost:5432/identity_ci

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Verify source provenance
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "SOURCE_SHA=$SOURCE_SHA"

      - name: Validate release shell scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/release/verify-published-image.sh scripts/release/smoke-runtime.sh; do
            bash -n "$script"
          done
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --shell=bash --severity=warning scripts/release/verify-published-image.sh scripts/release/smoke-runtime.sh
          else
            echo 'shellcheck unavailable; bash -n completed'
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.19.0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate schema and apply migrations
        run: |
          pnpm prisma:validate
          pnpm prisma:migrate:deploy
          pnpm prisma migrate status

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build production runtime image
        run: docker build --target runtime -t edupay-identity:ci .

      - name: Build production migration image
        run: docker build --target migrate -t edupay-identity-migrate:ci .

      - name: Smoke-test production runtime artifacts
        run: |
          docker run --rm --entrypoint node edupay-identity:ci -e "const fs = require('node:fs'); const files = ['dist/main.js', 'dist/email/worker-main.js', 'dist/bootstrap/identity-email-correction-main.js', 'dist/bootstrap/identity-email-verification-main.js']; if (files.some((file) => !fs.existsSync(file))) process.exit(1);"
          docker run --rm --entrypoint node edupay-identity:ci dist/bootstrap/identity-email-correction-main.js --help
          docker run --rm --entrypoint node edupay-identity:ci dist/bootstrap/identity-email-verification-main.js --help

  publish-runtime:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
      IMAGE: ghcr.io/sherydans12/edupay-identity
    steps:
      - name: Validate source SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out the exact source SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1

      - name: Verify checked out source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$GITHUB_SHA" = "$SOURCE_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the immutable runtime artifact
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: true
          tags: ${{ env.IMAGE }}:${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.title=EduPay Identity runtime
          provenance: mode=max
          sbom: true

      - name: Verify runtime digest, labels, SBOM, and provenance
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          EXPECTED_CMD_JSON='["node","dist/main.js"]' \
            bash scripts/release/verify-published-image.sh

      - name: Runtime smoke, health, and JWKS
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: bash scripts/release/smoke-runtime.sh
