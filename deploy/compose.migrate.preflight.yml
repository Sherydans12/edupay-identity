services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: preflight
      POSTGRES_PASSWORD: ${PREFLIGHT_DB_PASSWORD:?required}
      POSTGRES_DB: preflight
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preflight -d preflight"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    exclude_from_hc: true
    restart: "no"
    build:
      context: ..
      dockerfile: Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://preflight:${PREFLIGHT_DB_PASSWORD}@db:5432/preflight
    depends_on:
      db:
        condition: service_healthy
